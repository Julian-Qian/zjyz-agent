# Drawing packages can be large; actual parsing still validates a 120MB ceiling.
spring.servlet.multipart.max-file-size=120MB
spring.servlet.multipart.max-request-size=120MB

# OSS endpoint:
# - 非阿里云同VPC环境请使用公网 endpoint（默认）
# - 若部署在阿里云同地域VPC内，可改为 https://oss-cn-hangzhou-internal.aliyuncs.com
aliyun.oss.endpoint=https://oss-cn-hangzhou.aliyuncs.com
aliyun.oss.bucketName=zjyz-rent-prod-hz
# 从环境变量读取 AK/SK，避免明文入库
aliyun.oss.accessKeyId=${ALIYUN_OSS_ACCESS_KEY_ID:}
aliyun.oss.accessKeySecret=${ALIYUN_OSS_ACCESS_KEY_SECRET:}

# Agent-Beta 配额与成本控制
agent.quota.defaultUserMonthlyCallLimit=120
agent.quota.defaultUserDailyCallLimit=20
agent.quota.defaultTenantMonthlyTaskLimit=300
agent.quota.defaultUserMonthlyPromptTokenLimit=250000
agent.quota.defaultUserMonthlyCompletionTokenLimit=80000
agent.quota.defaultPremiumModelMonthlyLimit=10
agent.quota.defaultTenantMonthlyBudgetCny=500
agent.quota.requestMaxInputChars=1500
agent.quota.requestMaxInputTokens=4000
agent.quota.requestMaxOutputTokens=1200

# Agent-Beta 模型路由（默认 DeepSeek，低置信度回退 OpenAI）
agent.llm.enabled=true
agent.llm.lowConfidenceThreshold=0.78
agent.llm.timeoutMs=12000
agent.llm.answerMaxChars=800
agent.llm.defaultMaxOutputTokens=600

# Agent hybrid knowledge. Management/vector features stay off until V121,
# OSS, Embedding and the private Qdrant collections are ready.
agent.knowledge.enabled=${AGENT_KNOWLEDGE_ENABLED:true}
agent.knowledge.hybridEnabled=${AGENT_KNOWLEDGE_HYBRID_ENABLED:false}
agent.knowledge.managementEnabled=${AGENT_KNOWLEDGE_MANAGEMENT_ENABLED:false}
agent.knowledge.vectorEnabled=${AGENT_KNOWLEDGE_VECTOR_ENABLED:false}
agent.knowledge.maxFileBytes=${AGENT_KNOWLEDGE_MAX_FILE_BYTES:20971520}
agent.knowledge.workerDelayMs=${AGENT_KNOWLEDGE_WORKER_DELAY_MS:3000}
agent.embedding.baseUrl=${AGENT_EMBEDDING_BASE_URL:https://open.bigmodel.cn}
agent.embedding.apiKey=${ZHIPU_API_KEY:}
agent.embedding.model=${AGENT_EMBEDDING_MODEL:embedding-3}
agent.embedding.dimensions=${AGENT_EMBEDDING_DIMENSIONS:1024}
agent.embedding.connectTimeoutMs=${AGENT_EMBEDDING_CONNECT_TIMEOUT_MS:3000}
agent.embedding.readTimeoutMs=${AGENT_EMBEDDING_READ_TIMEOUT_MS:15000}
agent.qdrant.url=${QDRANT_URL:}
agent.qdrant.apiKey=${QDRANT_API_KEY:}
agent.qdrant.platformCollectionAlias=${QDRANT_PLATFORM_COLLECTION:zjyz_agent_platform_current}
agent.qdrant.tenantCollectionAlias=${QDRANT_TENANT_COLLECTION:zjyz_agent_tenant_current}
agent.qdrant.connectTimeoutMs=${QDRANT_CONNECT_TIMEOUT_MS:2000}
agent.qdrant.readTimeoutMs=${QDRANT_READ_TIMEOUT_MS:3000}

agent.llm.deepseek.baseUrl=https://api.deepseek.com
agent.llm.deepseek.apiKey=${DEEPSEEK_API_KEY:}
agent.llm.deepseek.model=deepseek-chat
agent.llm.deepseek.inputPricePerMillionCny=2
agent.llm.deepseek.outputPricePerMillionCny=3

agent.llm.fallback.enabled=true
agent.llm.fallback.baseUrl=https://api.openai.com/v1
agent.llm.fallback.apiKey=${OPENAI_API_KEY:}
agent.llm.fallback.model=gpt-4o-mini
agent.llm.fallback.inputPricePerMillionCny=1.8
agent.llm.fallback.outputPricePerMillionCny=14.4

# Agent Workspace model priority. Try GLM-5.2 first, then lower GLM models before
# considering the separately controlled cross-provider fallback below.
agent.runtime.model.primary=${AGENT_RUNTIME_MODEL_PRIMARY:glm-5.2}
agent.runtime.model.fallbackModels=${AGENT_RUNTIME_MODEL_FALLBACKS:glm-4.7,glm-4.5-air}

# Agent V2 runtime and model routing.
agent.v2.enabled=${AGENT_V2_ENABLED:true}
agent.v2.model.fallback.enabled=${AGENT_V2_MODEL_FALLBACK_ENABLED:true}
agent.v2.model.providerOrder=${AGENT_V2_MODEL_PROVIDER_ORDER:glm,deepseek,openai}
agent.v2.model.failureCooldownMs=${AGENT_V2_MODEL_FAILURE_COOLDOWN_MS:15000}
agent.v2.model.timeoutMs=${AGENT_V2_MODEL_TIMEOUT_MS:120000}
agent.v2.model.maxOutputTokens=${AGENT_V2_MODEL_MAX_OUTPUT_TOKENS:4096}
agent.v2.model.deepseek.model=${AGENT_V2_DEEPSEEK_MODEL:deepseek-v4-flash}

